<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leagues & Tournaments - Gaming Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(145, 36, 255, 0.5);
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
        }

        .btn-back {
            padding: 12px 24px;
            background: linear-gradient(135deg, #9124FF, #FF6682);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 48px;
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #9124FF, #FF6682);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .leagues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 30px;
        }

        .league-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(145, 36, 255, 0.5);
            transition: all 0.3s;
        }

        .league-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(145, 36, 255, 0.3);
        }

        .league-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .league-name {
            font-size: 26px;
            font-weight: bold;
            color: #9124FF;
        }

        .league-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #2ecc71;
            color: white;
        }

        .league-info {
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-label {
            color: #aaa;
        }

        .info-value {
            font-weight: 600;
            color: #ffd93d;
        }

        .league-description {
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tournaments-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid rgba(145, 36, 255, 0.3);
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd93d;
        }

        .tournament-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tournament-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tournament-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .tournament-status {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
        }

        .tournament-status.upcoming {
            background: #3498db;
            color: white;
        }

        .tournament-status.live {
            background: #e74c3c;
            color: white;
        }

        .tournament-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .detail-item {
            color: #ddd;
        }

        .bracket-info {
            background: rgba(255, 217, 61, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 217, 61, 0.3);
        }

        .bracket-title {
            font-size: 13px;
            font-weight: bold;
            color: #ffd93d;
            margin-bottom: 8px;
        }

        .bracket-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #ddd;
        }

        .btn-join-league {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #9124FF, #FF6682);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-join-league:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(145, 36, 255, 0.5);
        }

        .btn-join-league:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .btn-join-tournament {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .btn-join-tournament:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.5);
        }

        .btn-join-tournament:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .joined-badge {
            background: #2ecc71;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #aaa;
        }

        .empty-icon {
            font-size: 100px;
            margin-bottom: 30px;
        }

        @media (max-width: 1200px) {
            .leagues-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            🏅 Leagues & Tournaments
        </div>
        <a href="dashboard_multiplayer_html.html" class="btn-back">← Back to Dashboard</a>
    </div>

    <div class="container">
        <h1 class="page-title">🏅 Available Leagues</h1>
        <p class="page-subtitle">Join leagues and compete in multiple tournaments to earn rankings</p>

        <div class="leagues-grid" id="leaguesList"></div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser');

        if (!currentUser) {
            alert('Please login first!');
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadLeagues();
        });

        function calculateBracketInfo(participantCount) {
            if (!participantCount || participantCount < 2) {
                return {
                    rounds: 0,
                    totalMatches: 0,
                    breakdown: []
                };
            }

            // Find next power of 2 for bracket size
            let bracketSize = Math.pow(2, Math.ceil(Math.log2(participantCount)));
            
            let rounds = Math.log2(bracketSize);
            let totalMatches = bracketSize - 1;
            
            // Calculate matches per round
            let breakdown = [];
            let matchesInRound = bracketSize / 2;
            
            for (let i = 1; i <= rounds; i++) {
                let roundName = '';
                if (i === rounds) roundName = 'Final';
                else if (i === rounds - 1) roundName = 'Semi-Finals';
                else if (i === rounds - 2) roundName = 'Quarter-Finals';
                else roundName = `Round ${i}`;
                
                breakdown.push({
                    name: roundName,
                    matches: matchesInRound
                });
                
                matchesInRound /= 2;
            }
            
            return {
                rounds,
                totalMatches,
                breakdown
            };
        }

        function loadLeagues() {
            const leagues = JSON.parse(localStorage.getItem('leagues') || '[]');
            const tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');
            const approvedLeagues = leagues.filter(l => l.status === 'approved');

            const container = document.getElementById('leaguesList');

            if (!approvedLeagues.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🏅</div>
                        <div style="font-size:28px;margin-bottom:15px;">No Leagues Available</div>
                        <div style="font-size:16px;">Check back later for new league competitions!</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = approvedLeagues.map(league => {
                const isJoinedLeague = league.participants?.includes(currentUser);
                const leagueTournaments = league.tournaments.map(tId => 
                    tournaments.find(t => t.id === tId)
                ).filter(t => t !== undefined);

                return `
                    <div class="league-card">
                        <div class="league-header">
                            <div class="league-name">🏅 ${league.name}</div>
                            <span class="league-badge">ACTIVE</span>
                        </div>

                        <div class="league-description">${league.description}</div>

                        <div class="league-info">
                            <div class="info-row">
                                <span class="info-label">Duration</span>
                                <span class="info-value">⏱️ ${league.duration}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Entry Fee</span>
                                <span class="info-value">💰 $${league.entryFee || 0}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Prize Pool</span>
                                <span class="info-value">🏆 $${league.prizePool || 0}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Participants</span>
                                <span class="info-value">👥 ${league.participants?.length || 0}</span>
                            </div>
                        </div>

                        <div class="tournaments-section">
                            <div class="section-title">📋 Tournaments (${leagueTournaments.length})</div>
                            
                            ${leagueTournaments.map(tournament => {
                                const now = Date.now();
                                const startTime = new Date(tournament.startDate).getTime();
                                const isLive = now >= startTime && tournament.status !== 'completed';
                                const isJoinedTournament = tournament.participants?.includes(currentUser);
                                const isFull = tournament.participants?.length >= tournament.maxParticipants;
                                const participantCount = tournament.participants?.length || 0;
                                const bracketInfo = calculateBracketInfo(participantCount);

                                return `
                                    <div class="tournament-item">
                                        <div class="tournament-header">
                                            <div class="tournament-name">🏆 ${tournament.name}</div>
                                            <span class="tournament-status ${isLive ? 'live' : 'upcoming'}">
                                                ${isLive ? '🔴 LIVE' : 'Upcoming'}
                                            </span>
                                        </div>

                                        <div class="tournament-details">
                                            <div class="detail-item">📅 ${new Date(tournament.startDate).toLocaleDateString()}</div>
                                            <div class="detail-item">⏰ ${new Date(tournament.startDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                                            <div class="detail-item">🎮 ${tournament.gameType}</div>
                                            <div class="detail-item">👥 ${participantCount}/${tournament.maxParticipants}</div>
                                        </div>

                                        ${participantCount >= 2 ? `
                                            <div class="bracket-info">
                                                <div class="bracket-title">📊 Tournament Bracket</div>
                                                <div class="bracket-stats">
                                                    <span>🎯 ${bracketInfo.rounds} Rounds</span>
                                                    <span>⚔️ ${bracketInfo.totalMatches} Total Matches</span>
                                                </div>
                                                <div style="margin-top:8px;font-size:12px;color:#ddd;">
                                                    ${bracketInfo.breakdown.map(r => 
                                                        `<div style="margin-top:4px;">• ${r.name}: ${r.matches} match${r.matches > 1 ? 'es' : ''}</div>`
                                                    ).join('')}
                                                </div>
                                            </div>
                                        ` : `
                                            <div style="text-align:center;color:#aaa;font-size:12px;padding:10px;">
                                                ⏳ Bracket will be generated once 2+ players join
                                            </div>
                                        `}

                                        ${isJoinedTournament ? `
                                            <div class="joined-badge">✅ You're Registered</div>
                                        ` : isFull ? `
                                            <button class="btn-join-tournament" disabled>🚫 Tournament Full</button>
                                        ` : isLive ? `
                                            <button class="btn-join-tournament" disabled>🔴 Already Started</button>
                                        ` : `
                                            <button class="btn-join-tournament" onclick="joinTournament('${tournament.id}', '${league.id}')">
                                                📝 Join Tournament
                                            </button>
                                        `}
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        ${isJoinedLeague ? `
                            <div class="joined-badge" style="margin-top:20px;">✅ You're in this League</div>
                        ` : `
                            <button class="btn-join-league" onclick="joinLeague('${league.id}')">
                                🏅 Join League ($${league.entryFee || 'Free'})
                            </button>
                        `}
                    </div>
                `;
            }).join('');
        }

        function joinLeague(leagueId) {
            let leagues = JSON.parse(localStorage.getItem('leagues') || '[]');
            const league = leagues.find(l => l.id === leagueId);

            if (!league) {
                alert('League not found!');
                return;
            }

            if (league.participants?.includes(currentUser)) {
                alert('You are already in this league!');
                return;
            }

            if (league.entryFee > 0) {
                if (!confirm(`Join "${league.name}" for $${league.entryFee}?`)) {
                    return;
                }
            }

            if (!league.participants) {
                league.participants = [];
            }

            league.participants.push(currentUser);
            localStorage.setItem('leagues', JSON.stringify(leagues));

            alert(`✅ Successfully joined ${league.name}!`);
            loadLeagues();
        }

        function joinTournament(tournamentId, leagueId) {
            let tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');
            const tournament = tournaments.find(t => t.id === tournamentId);

            if (!tournament) {
                alert('Tournament not found!');
                return;
            }

            // Check if user is in the league first
            let leagues = JSON.parse(localStorage.getItem('leagues') || '[]');
            const league = leagues.find(l => l.id === leagueId);
            
            if (!league.participants?.includes(currentUser)) {
                alert('You must join the league first before joining its tournaments!');
                return;
            }

            if (tournament.participants?.includes(currentUser)) {
                alert('You are already registered for this tournament!');
                return;
            }

            if ((tournament.participants?.length || 0) >= tournament.maxParticipants) {
                alert('This tournament is full!');
                return;
            }

            if (!tournament.participants) {
                tournament.participants = [];
            }

            tournament.participants.push(currentUser);
            localStorage.setItem('tournaments', JSON.stringify(tournaments));

            alert(`✅ Successfully registered for ${tournament.name}!`);
            loadLeagues();
        }
    </script>
</body>
</html>
