<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Dashboard - Gaming Platform</title>
    <link rel="stylesheet" href="uiforadmin.css">
</head>

<body>
    <div id="adminPage" class="page active">
        <div class="header">
            <div class="header-title">
                <span>🛡️ Administrator: <span id="adminUsername"></span></span>
            </div>
            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="admin-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size:48px;margin-bottom:15px;">👥</div>
                    <div class="stat-value" id="totalUsers">0</div>
                    <div>Total Users</div>
                </div>
                <div class="stat-card">
                    <div style="font-size:48px;margin-bottom:15px;">📢</div>
                    <div class="stat-value" id="totalAds">0</div>
                    <div>Total Ads</div>
                </div>
                <div class="stat-card">
                    <div style="font-size:48px;margin-bottom:15px;">🚫</div>
                    <div class="stat-value" id="blockedUsers">0</div>
                    <div>Blocked Users</div>
                </div>
                <div class="stat-card">
                    <div style="font-size:48px;margin-bottom:15px;">🏅</div>
                    <div class="stat-value" id="pendingLeagues">0</div>
                    <div>Pending Leagues</div>
                </div>
            </div>

            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('users')">👥 Users</button>
                <button class="tab-btn" onclick="switchTab('ads')">📢 Advertisements</button>
                <button class="tab-btn" onclick="switchTab('leagues')">🏅 League Approvals</button>
                <button class="tab-btn tournament-btn" onclick="openTournament()">🏆 Tournaments</button>
            </div>

            <div id="usersTab" class="tab-content active">
                <div class="card">
                    <h2>👥 User Management</h2>
                    <div class="list-container" id="usersList"></div>
                </div>
            </div>

            <div id="adsTab" class="tab-content">
                <div class="admin-grid">
                    <div class="card">
                        <h2>📝 Create Advertisement</h2>
                        <div class="form-group">
                            <label>Ad Title</label>
                            <input type="text" id="adTitle" placeholder="Enter ad title">
                        </div>
                        <div class="form-group">
                            <label>Target URL</label>
                            <input type="url" id="adUrl" placeholder="https://example.com">
                        </div>
                        <div class="form-group">
                            <label>Ad Zone</label>
                            <select id="adZone">
                                <option value="top">Top Banner</option>
                                <option value="side">Side Banner</option>
                            </select>
                        </div>
                        <button class="btn-create" onclick="createAd()">Create Ad</button>
                    </div>

                    <div class="card">
                        <h2>📋 All Advertisements</h2>
                        <div class="list-container" id="adsList"></div>
                    </div>
                </div>
            </div>

            <!-- ADD THIS ENTIRE TAB SECTION -->
            <div id="leaguesTab" class="tab-content">
                <div class="card" style="grid-column: 1/-1;">
                    <h2>🏅 League Approval Requests</h2>
                    <div class="list-container" id="leaguesList"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentUser = '';

        function init() {
            currentUser = 'admin';
            document.getElementById('adminUsername').textContent = currentUser;
            loadUsers();
            loadAds();
            updateStats();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');

            if (tab === 'users') loadUsers();
            if (tab === 'ads') loadAds();
            if (tab === 'leagues') loadLeagues();
        }

        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('platformUsers') || '[]');
            const list = document.getElementById('usersList');
            list.innerHTML = users.length ? '' : '<p style="text-align:center;color:#aaa;padding:40px;">No users found</p>';

            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <div style="font-size:18px;font-weight:bold;">${user.username}
                            <span class="user-status ${user.blocked ? 'blocked' : 'active'}">
                                ${user.blocked ? 'Blocked' : 'Active'}
                            </span>
                        </div>
                        <div style="font-size:14px;color:#aaa;">Joined: ${user.joinDate || 'Unknown'}</div>
                    </div>
                    <div class="list-item-actions">
                        ${user.blocked ?
                        `<button class="btn-unblock" onclick="unblockUser('${user.username}')">Unblock</button>` :
                        `<button class="btn-block" onclick="blockUser('${user.username}')">Block</button>`
                    }
                        <button class="btn-delete" onclick="deleteUser('${user.username}')">Delete</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function blockUser(username) {
            if (!confirm(`Block user ${username}?`)) return;
            let users = JSON.parse(localStorage.getItem('platformUsers') || '[]');
            const user = users.find(u => u.username === username);
            if (user) user.blocked = true;
            localStorage.setItem('platformUsers', JSON.stringify(users));
            loadUsers();
            updateStats();
        }

        function unblockUser(username) {
            let users = JSON.parse(localStorage.getItem('platformUsers') || '[]');
            const user = users.find(u => u.username === username);
            if (user) user.blocked = false;
            localStorage.setItem('platformUsers', JSON.stringify(users));
            loadUsers();
            updateStats();
        }

        function deleteUser(username) {
            if (!confirm(`Delete user ${username}? This cannot be undone!`)) return;
            let users = JSON.parse(localStorage.getItem('platformUsers') || '[]');
            users = users.filter(u => u.username !== username);
            localStorage.setItem('platformUsers', JSON.stringify(users));
            loadUsers();
            updateStats();
        }

        function createAd() {
            const title = document.getElementById('adTitle').value.trim();
            const url = document.getElementById('adUrl').value.trim();
            const zone = document.getElementById('adZone').value;

            if (!title || !url) {
                alert('Please fill all fields');
                return;
            }

            const ads = JSON.parse(localStorage.getItem('arenaAds') || '[]');
            ads.push({
                id: Date.now(),
                title,
                url,
                zone,
                createdBy: 'admin',
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('arenaAds', JSON.stringify(ads));

            document.getElementById('adTitle').value = '';
            document.getElementById('adUrl').value = '';
            loadAds();
            updateStats();
            alert('Ad created successfully!');
        }

        function loadAds() {
            const ads = JSON.parse(localStorage.getItem('arenaAds') || '[]');
            const list = document.getElementById('adsList');
            list.innerHTML = ads.length ? '' : '<p style="text-align:center;color:#aaa;padding:40px;">No ads created</p>';

            ads.forEach(ad => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <div style="font-size:18px;font-weight:bold;">${ad.title}</div>
                        <div style="font-size:14px;color:#aaa;">Zone: ${ad.zone.toUpperCase()}</div>
                        <div style="font-size:14px;color:#aaa;">URL: ${ad.url}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteAd(${ad.id})">Delete</button>
                `;
                list.appendChild(div);
            });
        }

        function deleteAd(id) {
            if (!confirm('Delete this ad?')) return;
            let ads = JSON.parse(localStorage.getItem('arenaAds') || '[]');
            ads = ads.filter(a => a.id !== id);
            localStorage.setItem('arenaAds', JSON.stringify(ads));
            loadAds();
            updateStats();
        }

        function updateStats() {
            const users = JSON.parse(localStorage.getItem('platformUsers') || '[]');
            const ads = JSON.parse(localStorage.getItem('arenaAds') || '[]');
            const requests = JSON.parse(localStorage.getItem('leagueRequests') || '[]');

            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalAds').textContent = ads.length;
            document.getElementById('blockedUsers').textContent = users.filter(u => u.blocked).length;
            document.getElementById('pendingLeagues').textContent = requests.filter(r => r.status === 'pending').length;
        }

        function logout() {
            if (!confirm('Logout?')) return;

            // REMOVE AUTH ONLY
            localStorage.removeItem('session');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');

            // EXTRA SAFETY
            sessionStorage.clear();

            // HARD REDIRECT (prevents back navigation)
            window.location.replace('index.html');
        }

        function openTournament() {
            window.location.href = 'tournament_creation_page.html';
        }

        window.onload = init;


        function loadLeagues() {
            const requests = JSON.parse(localStorage.getItem('leagueRequests') || '[]');
            const leagues = JSON.parse(localStorage.getItem('leagues') || '[]');
            const tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');
            const list = document.getElementById('leaguesList');

            const pending = requests.filter(r => r.status === 'pending');

            if (!pending.length) {
                list.innerHTML = '<p style="text-align:center;color:#aaa;padding:60px;">✅ No pending league requests</p>';
                return;
            }

            list.innerHTML = '';

            pending.forEach(req => {
                const league = leagues.find(l => l.id === req.leagueId);
                if (!league) return;

                const leagueTournaments = league.tournaments.map(id => {
                    const t = tournaments.find(t => t.id === id);
                    return t ? `<span class="tournament-pill">🏆 ${t.name}</span>` : '';
                }).join('');

                const div = document.createElement('div');
                div.className = 'league-item';
                div.innerHTML = `
            <div class="league-header">
                <div class="league-name">🏅 ${league.name}</div>
                <span class="league-badge pending">PENDING</span>
            </div>
            
            <div class="league-info"><strong>Owner:</strong> ${league.owner}</div>
            <div class="league-info"><strong>Description:</strong> ${league.description}</div>
            <div class="league-info"><strong>Duration:</strong> ${league.duration}</div>
            <div class="league-info"><strong>Entry Fee:</strong> $${league.entryFee} | <strong>Prize Pool:</strong> $${league.prizePool}</div>
            <div class="league-info"><strong>Submitted:</strong> ${new Date(req.requestedAt).toLocaleString()}</div>
            
            <div style="margin-top:15px;margin-bottom:10px;">
                <strong>Tournaments (${league.tournaments.length}):</strong><br>
                ${leagueTournaments}
            </div>

            <textarea class="rejection-input" id="reason_${req.id}" placeholder="Enter rejection reason (optional)..." style="display:none;"></textarea>
            
            <div class="league-actions">
                <button class="btn-approve" onclick="approveLeague('${req.id}', '${league.id}')">
                    ✅ Approve League
                </button>
                <button class="btn-reject-league" onclick="toggleRejectReason('${req.id}')">
                    ❌ Reject
                </button>
            </div>
            
            <button class="btn-reject-league" id="confirmReject_${req.id}" style="display:none; margin-top:10px; width:100%;" onclick="rejectLeague('${req.id}', '${league.id}')">
                Confirm Rejection
            </button>
        `;
                list.appendChild(div);
            });
        }

        function toggleRejectReason(reqId) {
            const reasonField = document.getElementById('reason_' + reqId);
            const confirmBtn = document.getElementById('confirmReject_' + reqId);

            if (reasonField.style.display === 'none') {
                reasonField.style.display = 'block';
                confirmBtn.style.display = 'block';
            } else {
                reasonField.style.display = 'none';
                confirmBtn.style.display = 'none';
            }
        }

        function approveLeague(reqId, leagueId) {
            if (!confirm('Approve this league?')) return;

            // Update request status
            let requests = JSON.parse(localStorage.getItem('leagueRequests') || '[]');
            const request = requests.find(r => r.id === reqId);
            if (request) {
                request.status = 'approved';
                request.approvedAt = new Date().toISOString();
                request.approvedBy = currentUser;
            }
            localStorage.setItem('leagueRequests', JSON.stringify(requests));

            // Update league status
            let leagues = JSON.parse(localStorage.getItem('leagues') || '[]');
            const league = leagues.find(l => l.id === leagueId);
            if (league) {
                league.status = 'approved';
                league.approvedAt = new Date().toISOString();
            }
            localStorage.setItem('leagues', JSON.stringify(leagues));

            loadLeagues();
            updateStats();
            alert('✅ League approved successfully!');
        }

        function rejectLeague(reqId, leagueId) {
            const reason = document.getElementById('reason_' + reqId).value.trim();

            if (!reason) {
                alert('Please provide a rejection reason');
                return;
            }

            if (!confirm('Reject this league?')) return;

            // Update request status
            let requests = JSON.parse(localStorage.getItem('leagueRequests') || '[]');
            const request = requests.find(r => r.id === reqId);
            if (request) {
                request.status = 'rejected';
                request.rejectedAt = new Date().toISOString();
                request.rejectedBy = currentUser;
                request.rejectionReason = reason;
            }
            localStorage.setItem('leagueRequests', JSON.stringify(requests));

            // Update league status
            let leagues = JSON.parse(localStorage.getItem('leagues') || '[]');
            const league = leagues.find(l => l.id === leagueId);
            if (league) {
                league.status = 'rejected';
                league.rejectedAt = new Date().toISOString();
            }
            localStorage.setItem('leagues', JSON.stringify(leagues));

            loadLeagues();
            updateStats();
            alert('❌ League rejected.');
        }
    </script>
</body>

</html>
